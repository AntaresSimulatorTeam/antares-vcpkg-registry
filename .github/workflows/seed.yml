name: Seed asset mirror

# Builds a consumer repo at a given ref with the asset cache disabled, so every
# source archive is fetched from its origin URL, then mirrors whatever landed in
# vcpkg/downloads.
#
# Callable two ways:
#   - workflow_dispatch, to seed one (ref x OS) combination by hand;
#   - workflow_call, which is how refresh.yml fans out over mirror-targets.json.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Consumer repository to seed from
        required: true
        default: AntaresSimulatorTeam/Antares_Simulator
      ref:
        description: Branch or tag to seed (e.g. release/9.3.x)
        required: true
      runner:
        description: Runner image to seed on
        required: true
        default: windows-2022
        type: choice
        options: [windows-2022, ubuntu-22.04]
      triplet:
        description: vcpkg triplet
        required: true
        default: x64-windows-release
      mode:
        description: >-
          download-only is fast but best-effort; full-install also runs the
          builds, which is what pulls MSYS2 packages for some ports.
        required: true
        default: download-only
        type: choice
        options: [download-only, full-install]

  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string
      runner:
        required: true
        type: string
      triplet:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: download-only

permissions:
  # Needed to upload release assets. GitHub has no releases-only permission, so this
  # also grants write access to ports/ and versions/ -- keep this the only workflow
  # here that holds it. Consumers pin the registry by baseline SHA, so a bad push to
  # main does not change what any existing branch resolves.
  contents: write

jobs:
  seed:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout mirror tooling
        uses: actions/checkout@v4
        with:
          path: mirror

      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: consumer
          submodules: false

      - name: Bootstrap vcpkg
        shell: bash
        working-directory: consumer
        run: |
          git submodule update --init vcpkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Download dependencies from origin
        shell: bash
        working-directory: consumer
        env:
          # "clear" removes every asset source including defaults, so nothing is
          # served from the mirror and every archive is pulled from its origin.
          X_VCPKG_ASSET_SOURCES: clear
          VCPKG_BINARY_SOURCES: clear
        run: |
          # The manifest sits at the repo root on develop and 10.2.x, but under
          # src/ on 10.1.x and older (moved by 976407de99).
          if [ -f vcpkg.json ]; then
            manifest_root=.
          elif [ -f src/vcpkg.json ]; then
            manifest_root=src
          else
            echo "::error::no vcpkg.json at repo root or in src/" && exit 1
          fi
          echo "manifest root: $manifest_root"
          echo "MANIFEST_ROOT=$manifest_root" >> "$GITHUB_ENV"

          # The baseline decides which port versions -- and therefore which
          # source URLs -- this ref resolves, so it is what the asset set is
          # keyed by. Older branches carry it in vcpkg-configuration.json;
          # 8.8.x predates that and uses builtin-baseline in vcpkg.json.
          baseline=$(jq -r '.["default-registry"].baseline // empty' \
                       "$manifest_root/vcpkg-configuration.json" 2>/dev/null || true)
          if [ -z "$baseline" ]; then
            baseline=$(jq -r '.["builtin-baseline"] // empty' \
                         "$manifest_root/vcpkg.json" 2>/dev/null || true)
          fi
          [[ $baseline =~ ^[0-9a-f]{40}$ ]] || baseline=""
          [ -n "$baseline" ] || { echo "::error::could not determine vcpkg baseline for ${{ inputs.ref }}"; exit 1; }
          echo "vcpkg baseline: $baseline"
          echo "BASELINE=$baseline" >> "$GITHUB_ENV"

          extra=()
          [ "${{ inputs.mode }}" = "download-only" ] && extra+=(--only-downloads)

          # Best-effort: a dead upstream URL is exactly what we are trying to
          # work around, so one failure must not discard the archives that did
          # download. They get mirrored anyway and the rest is handled by the
          # manual recovery procedure in the README. The log is kept so the
          # summary step can report which URLs are already gone.
          ./vcpkg/vcpkg install \
            --x-manifest-root="$manifest_root" \
            --triplet "${{ inputs.triplet }}" \
            "${extra[@]}" 2>&1 | tee ../vcpkg-install.log \
            || echo "::warning::vcpkg exited non-zero; mirroring whatever was downloaded"

      - name: Upload new assets to the mirror
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_RESULT_FILE: mirror-result.txt
        run: ./mirror/tools/upload-downloads.sh consumer/vcpkg/downloads "$BASELINE"

      - name: Report
        if: always()
        shell: bash
        run: |
          new=n/a skipped=n/a tag="baseline-${BASELINE:-unknown}"
          # shellcheck disable=SC1090
          [ -f mirror-result.txt ] && . ./mirror-result.txt

          # Archives whose origin is already gone. These are the ones only the
          # manual recovery procedure in the README can bring back, so name them
          # rather than just counting them.
          dead=$(grep -h 404 vcpkg-install.log 2>/dev/null \
                   | grep -oE 'https?://[^ "]+' | sed 's#.*/##' | sort -u || true)

          {
            echo "### \`${{ inputs.ref }}\` on ${{ inputs.runner }}"
            echo
            echo "| baseline | new assets | already mirrored |"
            echo "|---|---:|---:|"
            echo "| [\`${BASELINE:-unknown}\`](https://github.com/${{ github.repository }}/releases/tag/$tag) | $new | $skipped |"
            if [ -n "$dead" ]; then
              echo
              echo "<details><summary>$(echo "$dead" | wc -l) archive(s) no longer available upstream</summary>"
              echo
              echo '```'
              echo "$dead"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ -z "$dead" ] || echo "::warning::${{ inputs.ref }} (${{ inputs.runner }}): upstream 404 for $(echo "$dead" | tr '\n' ' ')"
